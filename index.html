    <script>
      // Applies the saved theme before any page paints, on every route —
      // not just the ones that render the theme toggle button. Without
      // this, routes like /cert (no Navbar) would ignore the user's saved
      // preference and fall back to the OS default.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
